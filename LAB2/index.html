<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 2 - Responsive Navbar & Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-logo">
      <a href="#">MyStore</a>
    </div>


    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#">Shop</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>

 
    <div class="nav-cart">
      <a href="#" class="cart-icon" aria-label="Cart">
        🛒 <span class="cart-count">3</span>
      </a>
    </div>
  </header>

  <main class="container">
    <h2>Featured Products</h2>
    <div class="product-grid">

    
      <div class="product-card">
        <img src="https://via.placeholder.com/300x200?text=Product+1" alt="Product 1">
        <h3>Cappucino</h3>
        <p class="price">Rs 350.00</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/300x200?text=Product+2" alt="Product 2">
        <h3>Latte</h3>
        <p class="price">Rs 250.00</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/300x200?text=Product+3" alt="Product 3">
        <h3>hot chocolate</h3>
        <p class="price">Rs 150.00</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/300x200?text=Product+4" alt="Product 4">
        <h3>Green Tea</h3>
        <p class="price">Rs 100.00</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/300x200?text=Product+5" alt="Product 5">
        <h3>iced tea</h3>
        <p class="price">Rs 290.00</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/300x200?text=Product+6" alt="Product 6">
        <h3>Mocha</h3>
        <p class="price">Rs 300.00</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/300x200?text=Product+7" alt="Product 7">
        <h3>Espresso</h3>
        <p class="price">Rs 500.00</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/300x200?text=Product+8" alt="Product 8">
        <h3>Frappuccino</h3>
        <p class="price">Rs 240.00</p>
        <button>Add to Cart</button>
      </div>

    </div>
  </main>

</body>
</html>
